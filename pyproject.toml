[project]
name = "couch-buddy"
version = "0.1.0"
description = "AI gaming assistant that watches your screen and helps you play"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
vision = ["anthropic>=0.43.0", "mss>=9.0", "Pillow>=10.0"]

[project.scripts]
couch-buddy = "couch_buddy.app.main:main"
